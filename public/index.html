<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jana Nagyová</title>
  <meta name="description" content="Jana Nagyová">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80' font-family='Georgia'>J</text></svg>">
  <style>
    :root {
      --bg: #f7f5f1;
      --fg: #1f1d1a;
      --muted: #6b665e;
      --line: #d9d4ca;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --fg: #ece8e1; --muted: #9a948a; --line: #34312c; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    h1 {
      font-weight: normal;
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: 0.01em;
    }
    hr {
      width: 3rem;
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.5rem auto;
    }
    p {
      color: var(--muted);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    footer {
      position: fixed;
      bottom: 1.25rem;
      color: var(--muted);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jana Nagyová</h1>
    <hr>
    <p>Web se připravuje</p>
  </main>
  <footer>&copy; <span id="y">2026</span> jana-nagyova.cz</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
