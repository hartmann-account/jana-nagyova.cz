<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka nenalezena</title>
  <style>
    :root { --bg: #f7f5f1; --fg: #1f1d1a; --muted: #6b665e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #ece8e1; --muted: #9a948a; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--fg); font-family: Georgia, serif; text-align: center; padding: 1rem; }
    a { color: var(--muted); }
  </style>
</head>
<body>
  <div>
    <h1 style="font-weight:normal">Stránka nenalezena</h1>
    <p><a href="/">Zpět na úvod</a></p>

</html>
